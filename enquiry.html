<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Make a cake or bakery enquiry with Sweet Crumbs.">
  <title>Sweet Crumbs Bakery | Enquiry</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header"><div class="container nav-wrap">
<a class="logo" href="index.html">Sweet <span>Crumbs</span></a>
<nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About Us</a><a href="products.html">Products</a><a class="active" href="enquiry.html">Enquiry</a><a href="contact.html">Contact</a></nav>
</div></header>
<main>
<section class="page-banner"><div class="container"><p class="eyebrow">ENQUIRY</p><h1>Tell us what you have in mind.</h1><p>Complete the form below for a custom order or general product enquiry.</p></div></section>
<section class="section"><div class="container form-wrap">
<form id="enquiryForm" class="form-card">
<label for="name">Full name</label><input id="name" name="name" type="text" required>
<label for="email">Email address</label><input id="email" name="email" type="email" required>
<label for="type">Enquiry type</label><select id="type" name="type" required><option value="">Select one</option><option>Celebration cake</option><option>Cupcakes</option><option>Pastry order</option><option>General enquiry</option></select>
<label for="date">Preferred date</label><input id="date" name="date" type="date">
<label for="details">Order details</label><textarea id="details" name="details" rows="6" placeholder="Tell us about flavour, size, colours, quantity and any other requirements." required></textarea>
<button class="btn" type="submit">Send enquiry</button>
<p id="formMessage" class="form-message" aria-live="polite"></p>
</form>
</div></section>
</main>
<footer><div class="container"><p>© 2026 Sweet Crumbs Bakery. Student website project.</p></div></footer>
<script src="js/script.js"></script>
</body>
</html>
